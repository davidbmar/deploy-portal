# Deploy Portal Routes Configuration (NO AUTHENTICATION)
# This file is managed in the deploy-portal repository
# Deploy to: /etc/nginx/conf.d/routes/deploy-portal.conf
#
# WARNING: This configuration provides PUBLIC ACCESS to deploy portal
# Use this when oauth2-proxy is not available or not needed
# For production use with authentication, use routes-with-auth.conf

# Static files for deploy portal (no auth needed for CSS/JS)
location /deploy/static/ {
    alias /home/ubuntu/src/deploy-portal/static/;
    expires 1h;
    add_header Cache-Control "public, immutable";
}

# Deploy Portal (NO AUTHENTICATION - PUBLIC ACCESS)
location / {
    # Direct proxy to deploy portal application (port 5000)
    # NO AUTH CHECK - anyone with network access can use this portal
    proxy_pass http://deploy_portal;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support for terminal functionality
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
}
