# Deploy Portal Main Server Configuration
# This file should be deployed to: /etc/nginx/conf.d/deploy-portal-server.conf

# Upstream for deploy portal (must be defined before server block)
upstream deploy_portal {
    server 127.0.0.1:5000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Allow Let's Encrypt ACME challenge (if needed)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # Health check endpoint (no authentication required)
    location /health {
        proxy_pass http://deploy_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;  # Don't log health checks
    }

    # OAuth2 Proxy endpoints (for authentication)
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $scheme://$host$request_uri;
    }

    # Include all deploy portal routes (with authentication)
    include /etc/nginx/conf.d/routes/deploy-portal.conf;
}

# HTTPS Server Block (SSL)
# Self-signed certificate should be set up via scripts/setup-ssl.sh
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # SSL Certificate
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling off;  # Not applicable for self-signed
    ssl_stapling_verify off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Allow Let's Encrypt ACME challenge (for future migration)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # Health check endpoint (no authentication required)
    location /health {
        proxy_pass http://deploy_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;  # Don't log health checks
    }

    # OAuth2 Proxy endpoints (for authentication)
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Auth-Request-Redirect $scheme://$host$request_uri;
    }

    # Include all deploy portal routes (with authentication)
    include /etc/nginx/conf.d/routes/deploy-portal.conf;
}
